; Living Adventure Map - settings. Read when the game starts and again every time a game is started or loaded
; (change a value, load a save, see the result - no restart needed).
; Every value shows its default in brackets. 0 = off / 1 = on unless stated.

[Main]
Enabled = 1                 ; (1) 0 = the plugin installs nothing (needs a game restart): the original adventure map
Debug = 1                   ; (1) 0 nothing, 1 start-up, 2 details, 3 + every object graphic and a line every 10 s. Log: Runtime\Living Adventure Map\lam_log.txt
InGameLog = 1               ; (1) one line in the game log when a game starts
Fps = 20                    ; (20) adventure map redraws per second for the effects. The game alone does 5.5. 0 = only the game's rate (choppy). Object animations keep their normal speed

[Wind]
Strength = 1.0              ; (1.0) master strength of everything the wind does. 0 = no wind, 1.5 = storm
Angle = 12                  ; (12) main direction in degrees: 0 = blows to the right, 90 = down, 180 = to the left
Wander = 25                 ; (25) degrees the direction drifts around Angle over a few minutes
GustPeriod = 9              ; (9) seconds per "weather cell": larger = longer calm between gusty phases
GustLength = 1400           ; (1400) pixels between two gust fronts while it is gusty (32 px = 1 tile)
GustSpeed = 260             ; (260) pixels per second a gust front travels across the map
Breeze = 0.15               ; (0.15) wind that is always there between gusts, 0..1
Underground = 0             ; (0) 1 = wind, swaying, leaves and wisps also on the underground level (cloud shadows never: no sky)

[Trees]
Enabled = 1                 ; (1) plants sway in the wind. 0 = the game draws them as before
SwayLean = 1.7              ; (1.7) pixels a tall tree top leans in a full gust
SwayFlutter = 0.9           ; (0.9) pixels of quick back-and-forth on top of the lean
RichArt = 60                ; (60) 0 = original pixels, 100 = softened outer edge + light from the upper right, up to 200
Pine = 1                    ; (1) pines and snowy pines (also TUM's)
Broadleaf = 1               ; (1) green broadleaf trees, willows, swamp trees
Autumn = 1                  ; (1) autumn forests
Palm = 1                    ; (1) palms and yuccas
Shrubs = 1                  ; (1) shrubs, bushes, brush, flowers, plants, vines, dead vegetation (small sway)
Kelp = 1                    ; (1) kelp moves with the water (not with the wind)

[Leaves]
Enabled = 1                 ; (1) gusts take leaves off broadleaf trees, needles off pines, snow off snowy pines
Rate = 1.0                  ; (1.0) how many: 0.5 = half, 2 = double
MaxParticles = 900          ; (900) upper limit for everything small that moves (leaves, dust, flakes, embers ...)

[Wisps]
Enabled = 1                 ; (1) pale wind streaks that end in a curl, while it is gusty
Rate = 1.0                  ; (1.0) how many
Opacity = 38                ; (38) percent

[Clouds]
Enabled = 1                 ; (1) soft cloud shadows drifting with the wind (surface only)
Darkness = 14               ; (14) percent the ground is darkened in the middle of a shadow
Size = 420                  ; (420) pixels, size of a cloud
Speed = 14                  ; (14) pixels per second

[Terrain]
Enabled = 1                 ; (1) life of each ground type (switch single types below)
Rate = 1.0                  ; (1.0) how much
Grass = 1                   ; (1) grass bits in gusts, butterflies
Dirt = 1                    ; (1) dust puffs in gusts, rare tumbleweed and dust devil
Sand = 1                    ; (1) heat shimmer, sand puffs, dust devils, tumbleweed
Snow = 1                    ; (1) light snowfall, snow flurries in gusts, sparkles
Swamp = 1                   ; (1) bubbles, drifting mist, dragonflies
Rough = 1                   ; (1) dust puffs, tumbleweed, dust devils
Subterranean = 1            ; (1) dripping water, floating dust motes (bats come with the birds)
Lava = 1                    ; (1) heat shimmer, embers, bubbles
Water = 1                   ; (1) sun glints, whitecaps in gusts, fish (see [Water])
Highlands = 1               ; (1) JS - new terrains' Highlands: like grass (eagles come with the birds)

[Water]
Fish = 1                    ; (1) fish jump now and then in the sea and in lakes; rare dolphins on open sea
FishRate = 1.0              ; (1.0) how often
Glints = 1                  ; (1) sun glints on water and lakes

[Lava]
Bubbles = 1                 ; (1) bubbles rise, swell and pop on lava ground and lava lakes / flows
Rate = 1.0                  ; (1.0) how often bubbles appear (0..10)
Embers = 1                  ; (1) glowing embers rise from lava

[Birds]
Enabled = 1                 ; (1) a flock now and then: geese in a V, songbird swarms, crows, gulls over water, circling vultures and eagles, bats underground
Rate = 1.0                  ; (1.0) how often (about one flock every 20-50 s at 1.0)
Shadows = 1                 ; (1) birds and falling leaves cast a faint shadow

[Tracks]
Enabled = 1                 ; (1) heroes leave hoof prints (boats a wake): clear on the day of the move, faint the next day, gone after that. Kept in the save
Opacity = 55                ; (55) percent
SightOnly = 1               ; (1) tracks show only on tiles your heroes, towns, mines or dwellings can see right now. 0 = on every explored tile

[Smoke]
Enabled = 1                 ; (1) smoke from campfires (from the flames in the picture), bending with the wind
Rate = 1.0                  ; (1.0) how much
