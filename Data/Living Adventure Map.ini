; =====================================================================================================================
;  Living Adventure Map - settings
; =====================================================================================================================
; Read when the game starts and again every time a game is started or loaded: change a value, load a save, see it.
; Every line: Key = value ; (default) what it does. 1 = on, 0 = off unless the line says otherwise.
; Sections: Main | Wind | Compass | Tweaks | Trees | Leaves | Wisps | Clouds | Terrain | Water | Lava | Birds | Wildlife |
;           Tracks | Sound | Smoke | Buildings | Sites | Windmills | Banks | Dwellings | Towns | Secrets
; Many of them can also be set in the game: System Options > Other Settings > Living Adventure Tweak.

[Main]
Enabled = 1                 ; (1) 0 = the plugin installs nothing (needs a game restart): the original adventure map
Debug = 1                   ; (1) log detail: 0 nothing, 1 start-up, 2 + weather changes, 3 + every object graphic and a line every 10 s. Log: Runtime\Living Adventure Map\lam_log.txt
InGameLog = 1               ; (1) one line in the game log when a game starts
Fps = 20                    ; (20) map redraws per second for the effects (the game alone: 5.5). 0 = only the game's rate (choppy). Object animations keep their normal speed

; ---------------------------------------------------------------------------------------------------------------------
[Wind]
; The weather changes between calm, light, moderate and strong wind. Each spell lasts a few minutes and the change
; takes about half a minute. The direction veers on its own every one to three minutes. Trees, leaves, wisps, clouds,
; dust, smoke and birds all follow the same wind; the compass ([Compass]) shows it. Click the compass to choose your
; own wind instead (the wind window writes Manual / ManualDirection / ManualStrength below when you press OK).
Dynamic = 1                 ; (1) changing weather as described. 0 = a steady moderate wind with gusts
Weather = -1                ; (-1) -1 = changing weather. 0 = always calm, 1 = always light, 2 = always moderate, 3 = always strong
Calm = 40                   ; (40) share of the time with no wind (percent; the four shares are weights, they need not add to 100)
Light = 30                  ; (30) share of the time with a light wind
Moderate = 20               ; (20) share of the time with a moderate wind
Strong = 10                 ; (10) share of the time with a strong wind
SpellMin = 120              ; (120) seconds a weather spell lasts at least
SpellMax = 360              ; (360) seconds a weather spell lasts at most
Transition = 30             ; (30) seconds the wind takes to change from one spell to the next
Angle = 12                  ; (12) starting direction in degrees: 0 = blows to the right, 90 = down, 180 = to the left
Wander = 180                ; (180) degrees the direction may move away from Angle. 180 = any direction
Veer = 1.0                  ; (1.0) how far the wind turns when it veers (20-120 degrees at 1.0). 0 = the direction never changes
VeerMin = 60                ; (60) seconds between two veers at least
VeerMax = 180               ; (180) seconds between two veers at most
Strength = 1.0              ; (1.0) master strength of everything the wind does. 0 = no wind at all, 1.5 = wilder
GustPeriod = 9              ; (9) seconds per gust cell: larger = longer quiet stretches between gusty phases
GustLength = 1400           ; (1400) pixels between two gust fronts (32 px = 1 tile)
GustSpeed = 260             ; (260) pixels per second a gust front crosses the map (scaled by the wind strength)
Breeze = 0.15               ; (0.15) only with Dynamic = 0: wind that is always there between gusts, 0..1
Underground = 0             ; (0) 1 = wind, swaying, leaves and wisps also on the underground level (cloud shadows never: no sky)
Manual = 0                  ; (0) 1 = your own wind: the direction and strength below, held steady (gusts still come and go). 0 = the game decides
ManualDirection = 90        ; (90) where your own wind blows TO, in degrees: 0 = north (up), 90 = east, 180 = south, 270 = west
ManualStrength = 50         ; (50) its strength in percent: 0-4 calm, 5-27 light, 28-59 moderate, 60-100 strong

; ---------------------------------------------------------------------------------------------------------------------
[Compass]
; A small wind dial in a corner of the map view. The needle points where the wind blows TO (its light end); the three
; bars beside it show the strength: none lit = calm, then light, moderate, strong. The bars flicker in gusts.
Enabled = 1                 ; (1) show the wind compass
Clickable = 1               ; (1) left-click the compass: the wind window (let the game decide the wind, or set the direction and
                            ;     strength yourself). Right-click: what the wind does now. 0 = clicks go to the map as before
Corner = 3                  ; (3) where: 0 = top left, 1 = top right, 2 = bottom left, 3 = bottom right of the map view
Size = 18                   ; (18) radius of the dial in pixels (10..48; the tweak window sets 10..46)
Opacity = 0.85              ; (0.85) 0.1 = barely there .. 1 = solid

; ---------------------------------------------------------------------------------------------------------------------
[Tweaks]
; Also in the game: System Options > Other Settings > Living Adventure Tweak (below Script Message Disabling). That
; window also sets the compass corner and size, the leaf amount, the effects and the creature life switches of this
; ini (the keys it changes are written here when you press OK).
HideCompass = 0             ; (0) 1 = the wind compass is not shown on the adventure map (the [Compass] keys above stay as
                            ;     they are); the wind window then opens from the compass icon of the tweak window

; ---------------------------------------------------------------------------------------------------------------------
[Trees]
Enabled = 1                 ; (1) plants sway in the wind. 0 = the game draws them as before
Underground = 0             ; (0) 1 = plants on the underground level sway with the wind above ground (there is no
                            ;     wind underground unless [Wind] Underground = 1); 0 = they stand still there
SwayLean = 1.7              ; (1.7) pixels a tall tree top leans in a moderate gust (a storm leans about half again more)
SwayFlutter = 0.9           ; (0.9) pixels of quick back-and-forth on top of the lean
RichArt = 0                 ; (0) 0 = the trees' own pixels, as the game draws them (1.2). 100 = softened outer edge +
                            ;     light from the upper right (the 1.0 / 1.1 look, at 60), up to 200
SubPixel = 0                ; (0) 0 = the moving rows shift by whole pixels, every pixel stays as sharp as the game's
                            ;     picture (1.2). 1 = shifts in fractions of a pixel: smoother motion, a softer picture
TestCheck = 0               ; (0) test only: 1 = once per tree picture, the plugin's drawing at rest is compared with the
                            ;     game's own drawing of the same tile; the differences go to the log (Debug >= 1)
Pine = 1                    ; (1) pines and snowy pines (also TUM's)
Broadleaf = 1               ; (1) green broadleaf trees, willows, swamp trees
Autumn = 1                  ; (1) autumn forests
Palm = 1                    ; (1) palms and yuccas
Shrubs = 1                  ; (1) shrubs, bushes, brush, flowers, plants, vines, dead vegetation (small sway)
Kelp = 1                    ; (1) kelp moves with the water (not with the wind)

; ---------------------------------------------------------------------------------------------------------------------
[Leaves]
Enabled = 1                 ; (1) wind takes leaves off broadleaf trees, needles off pines, snow off snowy pines; none in a calm
Rate = 1.0                  ; (1.0) how many: 0.5 = half, 2 = double. The tweak window's "Leaf amount" bars set 0.1..1.0
Size = 1.0                  ; (1.0) leaf size: 1.0 = 2-3 px tumbling leaves, 1.5 = bigger
Drift = 1.0                 ; (1.0) how far the wind carries them: 1.0 = about 2 tiles a second in a full gust
MaxParticles = 1200         ; (1200) upper limit for everything small that moves (leaves, dust, flakes, embers, drops ...)

; ---------------------------------------------------------------------------------------------------------------------
[Wisps]
Enabled = 1                 ; (1) pale wind streaks that end in a curl, while it is gusty
Rate = 1.0                  ; (1.0) how many
Opacity = 38                ; (38) percent

; ---------------------------------------------------------------------------------------------------------------------
[Clouds]
Enabled = 1                 ; (1) soft cloud shadows drifting with the wind (surface only)
Darkness = 14               ; (14) percent the ground is darkened in the middle of a shadow
Size = 420                  ; (420) pixels, size of a cloud
Speed = 14                  ; (14) pixels per second (scaled by the wind)

; ---------------------------------------------------------------------------------------------------------------------
[Terrain]
Enabled = 1                 ; (1) life of each ground type (switch single types below)
Rate = 1.0                  ; (1.0) how much
Grass = 1                   ; (1) grass bits in gusts, butterflies
Dirt = 1                    ; (1) dust puffs in gusts, rare tumbleweed and dust devil
Sand = 1                    ; (1) heat shimmer, sand puffs, dust devils, tumbleweed
Snow = 1                    ; (1) light snowfall, snow flurries in gusts, sparkles
Swamp = 1                   ; (1) bubbles, drifting mist, dragonflies
Rough = 1                   ; (1) dust puffs, tumbleweed, dust devils
Subterranean = 1            ; (1) dripping water, floating dust motes
Lava = 1                    ; (1) heat shimmer, embers, bubbles (bursts: see [Lava])
Water = 1                   ; (1) sun glints, whitecaps in gusts, fish (see [Water])
Highlands = 1               ; (1) JS - new terrains' Highlands: like grass

; ---------------------------------------------------------------------------------------------------------------------
[Water]
Fish = 1                    ; (1) fish jump now and then in the sea and in lakes
FishRate = 1.0              ; (1.0) how often
Glints = 1                  ; (1) sun glints on water and lakes

; ---------------------------------------------------------------------------------------------------------------------
[Lava]
Bubbles = 1                 ; (1) bubbles rise, swell and pop on lava ground and lava lakes / flows
Rate = 1.0                  ; (1.0) how often bubbles appear (0..10)
Embers = 1                  ; (1) glowing embers rise from lava
Bursts = 1                  ; (1) rare bursts: a flash and a fountain of glowing drops that fall back and smoulder
BurstRate = 1.0             ; (1.0) how often (about one every 35-100 s while lava is in view at 1.0)
TestBursts = 0              ; (0) TEST: 1 = a burst every 8-12 s while lava is in view, each one written to the log

; ---------------------------------------------------------------------------------------------------------------------
[Birds]
Enabled = 1                 ; (1) a flock now and then, chosen by the land in view: geese, cranes, swans, flamingos, pelicans
                            ;     and ducks in V or line formation; starlings, sparrows, parakeets and bats in swarms; blue and
                            ;     scarlet macaws in pairs; gulls, crows, ravens and storks in loose groups; hawks and eagles circling
Rate = 1.0                  ; (1.0) how often (about one flock every 20-50 s at 1.0)
Shadows = 1                 ; (1) birds and falling leaves cast a faint shadow
Scavengers = 1              ; (1) over dead land (lava, dead trees, skulls, cursed ground) only vultures, ravens and crows. 0 = normal birds there too
Landing = 1                 ; (1) birds come down, sit a while (35-90 s) and fly up again - at once when a hero comes near.
                            ;     Roofs of any building (towns, dwellings, mines, taverns, shrines; dragon utopias only with
                            ;     its dragons off ([Buildings] Dragons or [Banks] Enabled = 0) - their walls are the dragons'): pigeons,
                            ;     white doves, magpies, storks, gulls, sparrows - never on flags, sails or other moving parts, nor
                            ;     next to flames. Tree tops (they sway
                            ;     with the tree): crows, ravens, starlings, sparrows, magpies, hawks, eagles, parakeets and macaws (palms,
                            ;     broadleaf, willows), vultures (dead trees). Open ground: those of the roofs, crows, ravens, starlings, gulls, geese, ducks,
                            ;     cranes, vultures. Flamingos (pink and white) only come where a lake object is in view and wade
                            ;     in its open water. Places a few tiles from the hero in view are preferred. Never on lava or
                            ;     near flames
LandChance = 0.7            ; (0.7) share of those flocks that come down to land, 0..1
ScareRange = 1              ; (1) a hero this many tiles from the ground under a sitting bird makes the flock fly up, 1..3
TestLanding = 0             ; (0) TEST: a flock every 8-12 s that always lands - 1 on a roof, 2 on a tree, 3 on the ground
                            ;     (birds that land there, never black ones) - each landing (or "found no place") written to the
                            ;     log. Needs Landing = 1. Leave at 0 for play

; ---------------------------------------------------------------------------------------------------------------------
[Wildlife]
; Animals drawn like the game's own pre-rendered art, at their real size against the heroes (a deer is about half a hero
; on horseback, an elephant about as tall). Each one is a brief, rare sighting tied to what is on the map.
Enabled = 1                 ; (1) brief sightings of animals, tied to what is on the map (switch single kinds below)
Rate = 1.0                  ; (1.0) how often: one try every 30-60 s at 1.0
MaxAtOnce = 2               ; (2) animals (or herds) on screen at the same time, 0..6
Drinkers = 1                ; (1) animals come to lakes and ponds to drink (deer, horses, bison, bears, wolves, camels, zebras, elephants, giraffes, moose, leopards)
Grazers = 1                 ; (1) animals and herds on open land and at forest edges (0 = only drinkers, swimmers and predators)
Predators = 1               ; (1) wolves, bears, leopards, snow leopards and cheetahs (0 = only peaceful animals)
Swimmers = 1                ; (1) alligators on swamp banks or drifting in swamp lakes, beavers swimming along rivers
Herons = 1                  ; (1) herons and egrets wading and fishing at swamp lakes
Penguins = 1                ; (1) penguins on snowy coasts that waddle and slide into the sea
Sea = 1                     ; (1) dolphin pods leaping, a circling shark fin on open sea
Horses = 1                  ; (1) wild horse herds on grass and highlands (bay, chestnut, grey, black), drinking at lakes there
Zebras = 1                  ; (1) zebra herds on sand and dirt, drinking at desert lakes
Elephants = 1               ; (1) elephant herds on sand, drinking at desert and swamp lakes
Bison = 1                   ; (1) bison and buffalo herds on grass and dirt
Giraffes = 1                ; (1) giraffes on sand and at desert lakes
Moose = 1                   ; (1) moose on snow and at snowy forest edges
Ibex = 1                    ; (1) ibex on mountain skylines and on rough ground
PolarBears = 1              ; (1) a polar bear on a snowy coast that walks into the sea and swims off
Hippos = 1                  ; (1) hippos in swamp lakes: on the bank (yawning) or afloat with only back and eyes showing
Ostriches = 1               ; (1) ostrich pairs running across sand

; ---------------------------------------------------------------------------------------------------------------------
[Tracks]
Enabled = 1                 ; (1) heroes leave a trampled trail with hoof prints (boats a wake): clear on the day of the move,
                            ;     faint the next day, gone after that. Kept in the save
Opacity = 55                ; (55) percent
SightOnly = 1               ; (1) tracks show only on tiles your heroes, towns, mines or dwellings can see right now. 0 = on every explored tile
DebugMarks = 0              ; (0) test aid: 1 = coloured marks where the trail is drawn (red ground layer, cyan overlay), 2 = a solid band

; ---------------------------------------------------------------------------------------------------------------------
[Sound]
; Quiet sounds of the living map, from Data\Living Adventure Map\Sounds (ElevenLabs sound effects): the wind in three
; strengths with its gusts, leaves rustling (off by default), the nearest fire (off by default), lava bubbles and bursts,
; splashing fish, birds flying up, calls of the birds and animals in view, the rare surprise. Left / right
; follows the screen, far off is quieter. Silent outside the adventure map and while the game is not the active window.
; The game's sound settings apply: everything follows the sound effects volume of System Options (off at 0) - there is
; no separate volume here; the wind is as loud as it is strong (a light wind about half as loud as a strong one); and
; nothing plays while "Background Sounds" (System Options, ERA) is off.
Enabled = 1                 ; (1) 0 = no sound at all from this mod (needs a game restart to come back on)
Nature = 1.0                ; (1.0) fire, lava, water, fireworks, 0..2
Birds = 1.0                 ; (1.0) bird calls and wings, 0..2
Animals = 1.0               ; (1.0) animal calls, 0..2
Fire = 0                    ; (0) crackling of the nearest campfire / burning object, 0..2 (also scaled by Nature). Off by
                            ; default: it loops while a fire is in view and can tire the ear. 1 = normal
Leaves = 0                  ; (0) rustling of leaves / grass in the wind while trees are in view, 0..2 (louder in a
                            ; stronger wind). Off by default: it loops and can tire the ear. 1 = normal

; ---------------------------------------------------------------------------------------------------------------------
[Smoke]
Enabled = 1                 ; (1) smoke from campfires (from the flames in the picture) bending with the wind
Rate = 1.0                  ; (1.0) how much
Bend = 1                    ; (1) the smoke that is part of the game's own pictures (chimneys, taverns, huts, camps -
                            ;     original, WoG, TUM and JS objects alike) bends downwind; the higher, the more. Volcanoes and
                            ;     geysers only with Volcanic = 1 (below)
BendStrength = 1.0          ; (1.0) how far it bends: 0.5 = half, 2 = double
Chimneys = 1                ; (1) (needs Enabled) buildings whose picture has a chimney or a fire but no smoke of its own smoke from it
                            ;     (war machine factory, seer's huts, refugee and mercenary camps, imp crucible, gog dwelling,
                            ;     beacon towers, banks with braziers or a roof flame, crypt torches). Buildings without a
                            ;     chimney get none
Glow = 1                    ; (1) the fires in those buildings' pictures glow warm and flicker (forges, hearths, campfires,
                            ;     torches, the lighthouse lamp)
Volcanic = 0                ; (0) EXPERIMENTAL - bend the plumes of volcanoes, vents and geysers too. WARNING: still being
                            ;     reworked - the bent plume leaves dark specks behind that do not look right. 0 = those
                            ;     plumes stay as the game draws them; chimneys, taverns and huts still bend (Bend above)

; ---------------------------------------------------------------------------------------------------------------------
[Buildings]
Training = 1                ; (1) adventure objects ("Adventure objects" in the tweak window) - for now Marletto Tower: now and then three swordsmen come out, train in front of the door (each with
                            ;     its own attack) and go back in after a while - or at once when a hero comes near. Swordsman,
                            ;     Crusader and, with Third Upgrade Mod, its Sword Master (else a second Swordsman)
Dragons = 1                 ; (1) dragon utopias: now and then a dragon of the kind guarding the bank right now comes out,
                            ;     flies around the castle, lands on its walls or the ground beside it, flies again and goes
                            ;     back in; none once the bank is cleared. Every bank object of the utopia's type (also from mods).
                            ;     The utopia is a creature bank: it also needs [Banks] Enabled = 1 ("Creature banks" in the tweak window)
TestDragons = 0             ; (0) test aid: 1 = also under the shroud, a new dragon tried every 3-6 s (at most one per
                            ;     flying guard kind + 1 out at once), the castle's corner / gate / places marked, place
                            ;     checks in the log (Debug 2); dragons then never hide behind objects. Leave 0

; ---------------------------------------------------------------------------------------------------------------------
[Sites]
Enabled = 1                 ; (1) still magic sites (shrines, fountains, wells, obelisks, idols, libraries, star axis, temples,
                            ;     learning stones, trees of knowledge, faerie rings) give off faint motes; magic plains blue,
                            ;     holy ground gold
                            ;     motes, cursed ground a thin dark haze; still objects in the sea make small rings in the water.
                            ;     Objects with an animation of their own are left as they are
Rate = 1.0                  ; (1.0) how often (0.2-3)

; ---------------------------------------------------------------------------------------------------------------------
[Windmills]
Enabled = 1                 ; (1) the sails turn with the wind: wind blowing toward 0-179 degrees (north over east to south)
                            ;     turns them the other way round, 180-359 the game's own way; still in a calm, slow in a light
                            ;     wind, faster in a strong wind. 0 = windmills turn as the game draws them
Smooth = 1                  ; (1) smooth sails: the plugin draws the sails between the game's 8 pictures (turned in their
                            ;     own tilted plane and cross-faded), at the plugin's frame rate ([Main] Fps). 0 = only the
                            ;     game's pictures (speed and direction still follow the wind)
CalmStop = 1                ; (1) in a calm (no bar lit on the compass) and underground the sails stand still; they run
                            ;     down and start again over Ease seconds. 0 = they keep turning slowly at CalmSpeed
Underground = 0             ; (0) 1 = windmills on the underground level turn with the wind above ground (there is no
                            ;     wind underground unless [Wind] Underground = 1); 0 = they stand still there
                            ;     (or turn at CalmSpeed when CalmStop = 0). Also in the Living Adventure Tweak window
CalmSpeed = 0.25            ; (0.25) speed in the lightest wind (in a calm too when CalmStop = 0), 1 = the game's own speed
                            ;     (one picture per 180 ms)
StrongSpeed = 1.6           ; (1.6) speed in the strongest wind; light / moderate winds lie between
Ease = 2.0                  ; (2.0) seconds the sails take to follow a change of the wind (0 = at once); a wind that turns
                            ;     round slows them, stops them and starts them the other way

; ---------------------------------------------------------------------------------------------------------------------
[Banks]
Enabled = 1                 ; (1) creature banks come alive: their guards fly and perch, walk and look around, or swim and
                            ;     dive around the bank (any bank, of the game or of other mods) until the bank is cleared
                            ;     (and again if its guards come back). The Dragon Utopia too ([Buildings] Dragons). Also in the
                            ;     Living Adventure Tweak window. Devils and their line (and any creature built like them)
                            ;     teleport: they vanish in flames and appear again somewhere else; Minotaurs always walk
TestCreature = 0            ; (0) test aid: a creature number = every bank and dwelling guard is shown as that creature

[Dwellings]
Enabled = 1                 ; (1) creatures come out of dwellings that have some to hire: half of those for hire (rounded up),
                            ;     at most 2 at a time, none when none can be hired. Flyers fly round and perch on the roof,
                            ;     the others walk in front and look around. Also in the Living Adventure Tweak window

[Towns]
Enabled = 1                 ; (1) a village grows in front of Castle towns as they are built: houses (2 with the Village
                            ;     Hall, 2 more per hall level, 1 per other building, none for upgrades), the tavern,
                            ;     marketplace, resource silo, blacksmith and mage guild, a well, watchtowers (one per fort
                            ;     level), market stalls, chapel, stable, bakery, lamps, gardens and trees. Decoration only;
                            ;     it keeps off map objects, roads and water and fades where a hero stands. Other towns later.
                            ;     Work in progress: town dwellings and special buildings are not shown yet. Tweak window:
                            ;     Special Immersion > Town Building Immersion
TestStage = 0               ; (0) test aid: 1..34 = show that growth step on every Castle instead of what is built,
                            ;     -1 = step through all of them, 4 seconds each (only the picture; the game is untouched)
TestView = 0                ; (0) test aid: 1 = after loading, move the map view to the first Castle and reveal its land

; ---------------------------------------------------------------------------------------------------------------------
[Secrets]
Enabled = 1                 ; (1) a very rare surprise somewhere on the map. Say no more
Chance = 0.0025             ; (0.0025) chance per minute while the right place is in view (about once in many hours of play)
Fireworks = 1               ; (1) it comes with a little celebration
Test = 0                    ; (0) 1 = show it once, a few seconds after a game is loaded, if the right place is in view (for testing)
